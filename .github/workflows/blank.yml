name: Server Side Downloader
on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - name: Install yt-dlp
      run: |
        sudo wget https://github.com -O /usr/local/bin/yt-dlp
        sudo chmod a+rx /usr/local/bin/yt-dlp

    - name: Download Video Server Side
      run: |
        yt-dlp -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" "https://www.youtube.com/watch?v=bHxLy6Qza3M" -o "downloaded_video.mp4"

    - name: Upload Video as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: youtube-video
        path: downloaded_video.mp4
