name: Server Side Downloader
on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.x'

    - name: Install yt-dlp via Pip
      run: |
        python3 -m pip install --upgrade yt-dlp

    - name: Run Video Download
      run: |
        yt-dlp --no-playlist -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" "https://www.youtube.com/watch?v=bHxLy6Qza3M" -o "downloaded_video.mp4"

    - name: Save Video File
      uses: actions/upload-artifact@v4
      with:
        name: youtube-video
        path: downloaded_video.mp4
